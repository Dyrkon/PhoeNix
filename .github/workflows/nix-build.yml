name: Nix Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Nix WebApp
      run: nix build .#webapp
    - name: Build Nix API
      run: nix build .#webapi
    - name: Build Nix Pxe runner
      run: nix build .#pxe-starter